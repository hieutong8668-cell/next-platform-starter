<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08293a" />
  <title>X79</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <section id="auth" class="screen active auth-screen">
    <div class="image-bg lobby-bg"></div><div class="scrim auth-scrim"></div>
    <div class="auth-brand"><b>X79</b><span>GAME ONLINE</span></div>
    <div class="auth-card">
      <div class="tabs"><button class="tab active" data-tab="login">ĐĂNG NHẬP</button><button class="tab" data-tab="register">ĐĂNG KÝ</button></div>
      <form id="loginForm" class="form active">
        <label>Tên đăng nhập<input autocomplete="username" placeholder="Tên đăng nhập" required></label>
        <label>Mật khẩu<input type="password" autocomplete="current-password" placeholder="Mật khẩu" required></label>
        <div class="row"><label class="remember"><input type="checkbox"> Ghi nhớ</label><button type="button" class="link-btn">Quên mật khẩu?</button></div>
        <button class="primary" type="submit">ĐĂNG NHẬP</button>
      </form>
      <form id="registerForm" class="form">
        <label>Tên đăng nhập<input placeholder="Tên đăng nhập" required></label>
        <label>Mật khẩu<input type="password" placeholder="Mật khẩu" required></label>
        <label>Nhập lại mật khẩu<input type="password" placeholder="Nhập lại mật khẩu" required></label>
        <label>Mã giới thiệu <small>(nếu có)</small><input placeholder="Mã giới thiệu"></label>
        <button class="primary" type="submit">ĐĂNG KÝ</button>
      </form>
    </div>
  </section>

  <section id="connect" class="screen connect-screen">
    <img src="assets/connect.svg" class="full-image" alt="Đang kết nối đến hệ thống X79">
    <div class="connect-runtime">
      <div class="percent" id="percent">0%</div>
      <div class="bar"><i id="barFill"></i></div>
      <div id="status">Đang xác thực tài khoản...</div>
    </div>
  </section>

  <section id="lobby" class="screen lobby-screen">
    <img src="assets/lobby.svg" class="full-image" alt="Sảnh chính X79">
    <button class="hotspot game-hotspot" aria-label="Sảnh game" data-go="games"></button>
    <button class="hotspot convert-hotspot" aria-label="Quy đổi" data-toast="QUY ĐỔI"></button>
    <button class="hotspot history-hotspot" aria-label="Lịch sử" data-toast="LỊCH SỬ"></button>
    <button class="hotspot settings-hotspot" aria-label="Cài đặt" data-toast="CÀI ĐẶT"></button>
    <button class="hotspot chat-hotspot" aria-label="Live chat" data-toast="LIVE CHAT"></button>
    <button class="hotspot menu-hotspot" aria-label="Menu" id="menuBtn"></button>
    <div class="side-menu" id="sideMenu"><button data-go="games">Sảnh game</button><button data-toast="LỊCH SỬ">Lịch sử</button><button data-toast="CÀI ĐẶT">Cài đặt</button><button id="logoutBtn">Đăng xuất</button></div>
    <div class="toast" id="toast"></div>
  </section>

  <section id="games" class="screen games-screen">
    <div class="image-bg lobby-bg"></div><div class="scrim games-scrim"></div>
    <header class="games-header"><button data-go="lobby">← SẢNH CHÍNH</button><b>X79 · SẢNH GAME</b><button data-toast="QUY ĐỔI">QUY ĐỔI</button></header>
    <div class="games-layout">
      <nav class="categories"><button class="active">TẤT CẢ</button><button>HOT</button><button>GAME BÀI</button><button>SÒNG BÀI</button><button>QUAY HŨ</button><button>BẮN CÁ</button><button>XỔ SỐ</button><button>MINI GAME</button></nav>
      <main class="game-grid">
        <article class="game-card first"><strong>XÓC ĐĨA</strong><span>HẠNG NHẤT</span><button data-toast="XÓC ĐĨA">VÀO GAME</button></article>
        <article class="game-card vip"><strong>XÓC ĐĨA MD5</strong><span>THƯƠNG GIA</span><button data-toast="XÓC ĐĨA MD5">VÀO GAME</button></article>
        <article class="game-card tai"><strong>TÀI XỈU</strong><span>PHIÊN NHANH</span><button data-toast="TÀI XỈU">VÀO GAME</button></article>
        <article class="game-card bac"><strong>BACCARAT</strong><span>LIVE TABLE</span><button data-toast="BACCARAT">VÀO GAME</button></article>
        <article class="game-card slot"><strong>NỔ HŨ</strong><span>JACKPOT</span><button data-toast="NỔ HŨ">VÀO GAME</button></article>
        <article class="game-card fish"><strong>BẮN CÁ</strong><span>3D</span><button data-toast="BẮN CÁ">VÀO GAME</button></article>
        <article class="game-card poker"><strong>POKER</strong><span>GAME BÀI</span><button data-toast="POKER">VÀO GAME</button></article>
        <article class="game-card roulette"><strong>ROULETTE</strong><span>LIVE</span><button data-toast="ROULETTE">VÀO GAME</button></article>
      </main>
    </div>
    <div class="toast" id="toastGames"></div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
