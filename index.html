<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b12">
<meta name="color-scheme" content="dark">
<title>X79</title>
<style>
:root{--gold:#efc760;--gold2:#a96d20;--cyan:#36cbd7;--ink:#020b12;--panel:#061c27;--line:rgba(239,199,96,.42)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}button,input{font:inherit}button{touch-action:manipulation}.app{position:fixed;inset:0;background:#020b12;overflow:hidden}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .32s ease,visibility 0s linear .32s;background:#020b12}.screen.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .32s ease,visibility 0s linear 0s;z-index:2}.screen.leaving{opacity:0;visibility:visible;z-index:3}.blur-bg{position:absolute;inset:-4%;background-position:center;background-size:cover;filter:blur(24px) brightness(.34) saturate(1.08);transform:scale(1.08);opacity:0;transition:opacity .25s}.blur-bg.ready{opacity:1}.stage{position:relative;max-width:100vw;max-height:100vh;overflow:hidden;background:radial-gradient(circle at 55% 40%,#0b3a49,#03131c 68%);box-shadow:0 0 80px rgba(0,0,0,.55)}.stage.banner{width:min(100vw,calc(100vh * 1.5006));aspect-ratio:1280/853}.stage.wide{width:min(100vw,calc(100vh * 1.77778));aspect-ratio:16/9}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:0;transition:opacity .24s ease}.art.ready{opacity:1}.sweep{position:absolute;inset:-25%;pointer-events:none;background:linear-gradient(112deg,transparent 44%,rgba(255,235,174,.11) 49%,rgba(255,248,218,.2) 50%,rgba(255,235,174,.07) 53%,transparent 58%);animation:sweep 9s ease-in-out infinite;mix-blend-mode:screen}.visual-hotspot{position:absolute;z-index:8;border:0;background:transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}.visual-hotspot:hover,.visual-hotspot:focus-visible{transform:scale(1.05);box-shadow:0 0 34px rgba(239,199,96,.32);background:rgba(255,225,135,.035);outline:1px solid rgba(246,210,106,.28)}.visual-hotspot:active{transform:scale(.98);transition-duration:.07s}.login-hot{left:32.1%;top:53.15%;width:17.25%;height:10.05%}.register-hot{left:51.05%;top:53.15%;width:16.75%;height:10.05%}
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;opacity:0;visibility:hidden;pointer-events:none;background:rgba(1,7,11,.74);backdrop-filter:blur(12px);transition:opacity .25s,visibility 0s linear .25s}.modal.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s}.auth-card{position:relative;width:min(470px,92vw);padding:28px;border:1px solid rgba(239,199,96,.48);background:linear-gradient(180deg,rgba(7,44,56,.98),rgba(3,20,28,.99));box-shadow:0 30px 100px rgba(0,0,0,.66),inset 0 0 44px rgba(83,206,218,.04)}.close{position:absolute;right:9px;top:4px;border:0;background:transparent;color:var(--gold);font-size:30px;cursor:pointer}.auth-logo{text-align:center;font-size:48px;line-height:1;font-weight:950;color:var(--gold);margin-bottom:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(239,199,96,.22);margin-bottom:20px}.tab{border:0;background:transparent;padding:12px;color:#79949d;font-weight:900;cursor:pointer;transition:.2s}.tab.on{color:#f2cf73;border-bottom:2px solid var(--gold)}.form-wrap{display:grid;overflow:hidden}.form{grid-area:1/1;display:grid;gap:12px;opacity:0;visibility:hidden;transform:translateX(18px);transition:opacity .22s,transform .22s,visibility 0s linear .22s}.form.on{opacity:1;visibility:visible;transform:none;transition:opacity .22s,transform .22s}.form label{display:grid;gap:6px;color:#c8d7db;font-size:13px}.form input{width:100%;padding:13px 14px;border:1px solid rgba(239,199,96,.28);background:#041923;color:#fff;outline:none}.form input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(239,199,96,.08)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.remember{display:flex!important;align-items:center;grid-auto-flow:column;gap:7px!important}.remember input{width:auto}.link{border:0;background:transparent;color:#eac469;cursor:pointer}.primary{border:1px solid #f8dd94;background:linear-gradient(180deg,#f1d275,#b67c29);color:#111820;padding:14px;font-weight:950;cursor:pointer;transition:transform .2s,filter .2s}.primary:hover{transform:scale(1.03);filter:brightness(1.06)}.primary:active{transform:scale(.98)}.msg{min-height:18px;color:#f2cf73;text-align:center;font-size:12px;margin-top:8px}
.connect-mask{position:absolute;z-index:5;left:60.05%;top:59.45%;width:7.75%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#071c28 0 58%,#061925 73%,#061925 100%);box-shadow:0 0 26px rgba(0,0,0,.28)}.connect-mask strong{font-size:clamp(18px,3.1vw,54px);color:#f1c45a;text-shadow:0 3px 0 rgba(0,0,0,.22)}.status-mask{position:absolute;z-index:5;left:49.35%;top:71.9%;width:22.2%;height:4.3%;display:grid;place-items:center;background:linear-gradient(90deg,rgba(3,22,34,0),rgba(3,22,34,.98) 12%,rgba(3,22,34,.98) 88%,rgba(3,22,34,0));color:#d3e5eb;font-size:clamp(9px,1.05vw,18px);white-space:nowrap}.progress{position:absolute;z-index:6;left:50.75%;top:77.55%;width:18.6%;height:5px;border-radius:999px;background:rgba(255,255,255,.13);overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),#f4c655);box-shadow:0 0 13px rgba(50,205,226,.7);border-radius:inherit}
.lobby-light{position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(115deg,transparent 45%,rgba(255,244,202,.07) 50%,transparent 55%);animation:sweep 11s ease-in-out infinite}.game,.action{position:absolute;z-index:8;border:0;background:transparent;cursor:pointer;border-radius:14px;transition:transform .2s,box-shadow .2s,background .2s,outline-color .2s}.game:hover,.game:focus-visible,.action:hover,.action:focus-visible{transform:scale(1.05);background:rgba(40,215,221,.035);box-shadow:0 0 28px rgba(40,218,225,.34),inset 0 0 0 1px rgba(248,211,107,.74);outline:none}.game:active,.action:active{transform:scale(.985);transition-duration:.07s}.g1{left:44.14%;top:13.61%;width:13.52%;height:25.56%}.g2{left:57.97%;top:13.61%;width:13.59%;height:25.56%}.g3{left:71.72%;top:13.61%;width:13.28%;height:25.56%}.g4{left:85.16%;top:13.61%;width:12.97%;height:25.56%}.g5{left:44.14%;top:39.58%;width:13.52%;height:21.53%}.g6{left:57.97%;top:39.58%;width:13.59%;height:21.53%}.g7{left:71.72%;top:39.58%;width:13.28%;height:21.53%}.g8{left:85.16%;top:39.58%;width:12.97%;height:21.53%}.t1{left:11.09%;top:64.31%;width:22.42%;height:29.58%;border-radius:9px}.t2{left:33.59%;top:64.31%;width:20.16%;height:29.58%;border-radius:9px}.t3{left:53.91%;top:64.31%;width:20.78%;height:29.58%;border-radius:9px}.t4{left:74.84%;top:64.31%;width:24.38%;height:29.58%;border-radius:9px}.exchange{left:69.3%;top:.8%;width:7.3%;height:8.9%}.mail{left:76.6%;top:.8%;width:7.2%;height:8.9%}.events{left:83.8%;top:.8%;width:7.2%;height:8.9%}.missions{left:90%;top:.8%;width:5.5%;height:8.9%}.settings{left:95.1%;top:.8%;width:4.7%;height:8.9%}.logout{position:absolute;z-index:12;left:62.25%;top:7.25%;width:6.2%;height:3.45%;min-height:20px;border:1px solid rgba(245,201,91,.7);border-radius:999px;background:rgba(3,25,34,.94);color:#f5cf69;font-size:clamp(7px,.68vw,11px);font-weight:900;cursor:pointer;transition:.2s}.logout:hover{transform:scale(1.05);box-shadow:0 0 18px rgba(238,190,72,.3)}.toast{position:absolute;left:50%;bottom:5%;z-index:20;transform:translate(-50%,16px);opacity:0;padding:9px 18px;border:1px solid rgba(239,199,96,.55);background:rgba(2,19,27,.94);color:#f0ca68;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-auth{display:none}@keyframes sweep{0%,30%{transform:translateX(-45%);opacity:0}45%{opacity:.8}72%,100%{transform:translateX(45%);opacity:0}}
@media(max-width:800px){.stage.banner{width:min(100vw,calc(100vh * 1.5006))}.mobile-auth{display:grid;position:absolute;z-index:14;left:5%;right:5%;bottom:4%;grid-template-columns:1fr 1fr;gap:10px}.mobile-auth button{min-height:48px;border:1px solid var(--gold);font-weight:900}.mobile-auth button:first-child{background:linear-gradient(#f3d47b,#b67b28);color:#101820}.mobile-auth button:last-child{background:rgba(4,30,41,.92);color:#f0cd70}.login-hot,.register-hot{display:none}.logout{left:59.7%;top:7.1%;width:8.8%;height:4.1%;font-size:clamp(6px,1.45vw,9px)}.connect-mask strong{font-size:clamp(13px,5vw,28px)}.status-mask{font-size:clamp(7px,2vw,12px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app">
<section id="welcome" class="screen active" aria-label="X79 Đăng nhập">
  <div id="bannerBlur" class="blur-bg"></div><div class="stage banner"><img id="bannerArt" class="art" alt="X79"><div class="sweep"></div><button class="visual-hotspot login-hot" data-open="login" aria-label="Đăng nhập"></button><button class="visual-hotspot register-hot" data-open="register" aria-label="Đăng ký"></button><div class="mobile-auth"><button data-open="login">ĐĂNG NHẬP</button><button data-open="register">ĐĂNG KÝ</button></div></div>
  <div id="authModal" class="modal" aria-hidden="true"><div class="auth-card"><button id="closeAuth" class="close" type="button">×</button><div class="auth-logo">X79</div><div class="tabs"><button class="tab on" data-tab="login">ĐĂNG NHẬP</button><button class="tab" data-tab="register">ĐĂNG KÝ</button></div><div class="form-wrap"><form id="loginForm" class="form on" data-form="login"><label>Tên đăng nhập<input name="username" autocomplete="username" minlength="3" required placeholder="Nhập tên đăng nhập"></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Nhập mật khẩu"></label><div class="row"><label class="remember"><input type="checkbox"> Ghi nhớ</label><button type="button" class="link">Quên mật khẩu?</button></div><button class="primary" type="submit">ĐĂNG NHẬP</button></form><form id="registerForm" class="form" data-form="register"><label>Tên đăng nhập<input name="username" minlength="3" required placeholder="Tạo tên đăng nhập"></label><label>Mật khẩu<input name="password" type="password" minlength="6" required placeholder="Tạo mật khẩu"></label><label>Nhập lại mật khẩu<input name="confirm" type="password" minlength="6" required placeholder="Nhập lại mật khẩu"></label><label>Mã giới thiệu <small>(nếu có)</small><input name="referral" placeholder="Mã giới thiệu"></label><button class="primary" type="submit">ĐĂNG KÝ</button></form></div><div id="authMsg" class="msg"></div></div></div>
</section>
<section id="connect" class="screen" aria-label="Đang kết nối"><div id="connectBlur" class="blur-bg"></div><div class="stage wide"><img id="connectArt" class="art" alt="Đang kết nối đến hệ thống X79"><div class="sweep"></div><div class="connect-mask"><strong id="percent">0%</strong></div><div class="status-mask" id="status">Đang xác thực tài khoản...</div><div class="progress"><i id="bar"></i></div></div></section>
<section id="lobby" class="screen" aria-label="Sảnh X79"><div id="lobbyBlur" class="blur-bg"></div><div class="stage wide"><img id="lobbyArt" class="art" alt="Sảnh game X79"><div class="lobby-light"></div><button class="game g1" data-label="XÓC ĐĨA"></button><button class="game g2" data-label="XÓC ĐĨA MD5"></button><button class="game g3" data-label="TÀI XỈU"></button><button class="game g4" data-label="TÀI XỈU MD5"></button><button class="game g5" data-label="BẮN CÁ"></button><button class="game g6" data-label="NỔ HŨ"></button><button class="game g7" data-label="POKER"></button><button class="game g8" data-label="BLACKJACK"></button><button class="game t1" data-label="XÓC ĐĨA LIVE"></button><button class="game t2" data-label="TÀI XỈU LIVE"></button><button class="game t3" data-label="BACCARAT"></button><button class="game t4" data-label="ROULETTE"></button><button class="action exchange" data-label="QUY ĐỔI"></button><button class="action mail" data-label="HỘP THƯ"></button><button class="action events" data-label="SỰ KIỆN"></button><button class="action missions" data-label="NHIỆM VỤ"></button><button class="action settings" data-label="CÀI ĐẶT"></button><button id="logout" class="logout" type="button">ĐĂNG XUẤT</button><div id="toast" class="toast"></div></div></section>
</main>
<script>
(()=>{'use strict';
const ROUTE_KEY='x79.ui.route.final';const CONNECT_DURATION=2000;const screens=[...document.querySelectorAll('.screen')];let route='welcome',busy=false,raf=0,toastTimer=0;
async function loadB64(imgId,blurId,path){const img=document.getElementById(imgId),blur=document.getElementById(blurId);try{const r=await fetch(path+'?v=20260811-final2',{cache:'no-store'});if(!r.ok)throw 0;const t=(await r.text()).replace(/\s+/g,'');const bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const type=t.startsWith('iVBOR')?'image/png':'image/jpeg',url=URL.createObjectURL(new Blob([u],{type}));img.onload=()=>{img.classList.add('ready');blur.style.backgroundImage=`linear-gradient(rgba(2,9,15,.38),rgba(2,9,15,.58)),url("${url}")`;blur.classList.add('ready')};img.src=url;return url}catch(e){return null}}
loadB64('bannerArt','bannerBlur','assets/banner-main-20260811.b64');loadB64('connectArt','connectBlur','assets/connect-prod-20260811.b64');loadB64('lobbyArt','lobbyBlur','assets/lobby-prod-20260811.b64');
function show(id,persist=true){const next=document.getElementById(id),prev=screens.find(s=>s.classList.contains('active')&&s!==next);if(prev){prev.classList.add('leaving');prev.classList.remove('active');setTimeout(()=>prev.classList.remove('leaving'),330)}screens.forEach(s=>{if(s!==next&&s!==prev)s.classList.remove('active','leaving')});next.classList.add('active');route=id;if(persist){sessionStorage.setItem(ROUTE_KEY,id);history.replaceState({x79:id},'',location.pathname+location.search)}}
const modal=document.getElementById('authModal'),tabs=[...document.querySelectorAll('[data-tab]')],forms=[...document.querySelectorAll('[data-form]')],msg=document.getElementById('authMsg');function setTab(v){tabs.forEach(t=>t.classList.toggle('on',t.dataset.tab===v));forms.forEach(f=>f.classList.toggle('on',f.dataset.form===v));msg.textContent=''}function openAuth(v){if(route!=='welcome'||busy)return;setTab(v);modal.classList.add('open');modal.setAttribute('aria-hidden','false')}function closeAuth(){if(busy)return;modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openAuth(b.dataset.open));tabs.forEach(t=>t.onclick=()=>setTab(t.dataset.tab));document.getElementById('closeAuth').onclick=closeAuth;modal.onpointerdown=e=>{if(e.target===modal)closeAuth()};
function statusFor(p){return p<28?'Đang xác thực tài khoản...':p<62?'Đang kết nối máy chủ...':p<90?'Đang đồng bộ dữ liệu...':p<100?'Đang hoàn tất...':'Hoàn tất'}function runConnect(){if(busy)return;busy=true;modal.classList.remove('open');show('connect');const pct=document.getElementById('percent'),bar=document.getElementById('bar'),st=document.getElementById('status'),start=performance.now();const tick=now=>{const raw=Math.min(1,(now-start)/CONNECT_DURATION),ease=1-Math.pow(1-raw,2.15),p=raw>=1?100:Math.min(99,Math.floor(ease*100));pct.textContent=p+'%';bar.style.width=p+'%';st.textContent=statusFor(p);if(raw<1){raf=requestAnimationFrame(tick)}else{pct.textContent='100%';bar.style.width='100%';st.textContent='Hoàn tất';show('lobby');busy=false}};raf=requestAnimationFrame(tick)}
function submit(e,type){e.preventDefault();if(busy||route!=='welcome'||!e.currentTarget.reportValidity())return;if(type==='register'&&e.currentTarget.elements.password.value!==e.currentTarget.elements.confirm.value){msg.textContent='Mật khẩu nhập lại chưa khớp.';return}runConnect()}document.getElementById('loginForm').onsubmit=e=>submit(e,'login');document.getElementById('registerForm').onsubmit=e=>submit(e,'register');
function logout(){if(busy)return;cancelAnimationFrame(raf);sessionStorage.removeItem(ROUTE_KEY);document.getElementById('loginForm').reset();document.getElementById('registerForm').reset();document.getElementById('percent').textContent='0%';document.getElementById('bar').style.width='0%';document.getElementById('status').textContent=statusFor(0);history.replaceState({x79:'welcome'},'',location.pathname+location.search);show('welcome',false)}document.getElementById('logout').onclick=logout;
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1200)}document.querySelectorAll('[data-label]').forEach(b=>{let lock=false;b.onclick=()=>{if(route!=='lobby'||lock)return;lock=true;toast(b.dataset.label);setTimeout(()=>lock=false,360)}});
window.addEventListener('popstate',()=>{if(route==='lobby'||route==='connect'){history.replaceState({x79:route},'',location.pathname+location.search);show(route,false)}else show('welcome',false)});const saved=sessionStorage.getItem(ROUTE_KEY);if(saved==='lobby')show('lobby');else if(saved==='connect'){route='welcome';runConnect()}else show('welcome');})();
</script>
</body>
</html>
